apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cloudcart-backend
  namespace: monitoring
  labels:
    release: monitoring

spec:
  namespaceSelector:
    matchNames:
      - cloudcart

  selector:
    matchLabels:
      app: cloudcart-backend

  endpoints:
  - port: metrics
    path: /metrics
    interval: 15s