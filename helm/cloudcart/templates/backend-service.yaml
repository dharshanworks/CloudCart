apiVersion: v1
kind: Service

metadata:
  name: cloudcart-backend-service
  labels:
    app: cloudcart-backend

spec:
  selector:
    app: cloudcart-backend

  ports:
    - name: metrics
      port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.port }}

  type: {{ .Values.backend.service.type }}